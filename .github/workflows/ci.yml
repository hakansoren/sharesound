name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ShareSound needs the macOS 26 SDK (Liquid Glass APIs).
    # An older runner image will fail to build.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./Scripts/build-app.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ShareSound.app
          path: dist/ShareSound.app
